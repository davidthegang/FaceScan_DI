<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ប្រព័ន្ធស្កេនមុខឌីជីថល</title>
    
    <!-- App Icon -->
    <link rel="icon" href="https://media.istockphoto.com/id/1166057711/vector/biometric-person-identification-facial-recognition-concept-futuristic-low-polygonal-human.jpg?s=612x612&w=0&k=20&c=bEePF402x94i0sHzgQ9kc8TSGb3jSs4DbeqIusyiIPM=" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Moul&display=swap" rel="stylesheet">

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel (for in-browser JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Face-API.js -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <!-- Custom CSS Styles -->
    <style>
        :root {
            --theme-color: #4f46e5; /* indigo */
            --theme-color-hover: #4338ca;
        }
        .theme-blue { --theme-color: #3b82f6; --theme-color-hover: #2563eb; }
        .theme-green { --theme-color: #22c55e; --theme-color-hover: #16a34a; }
        .theme-red { --theme-color: #ef4444; --theme-color-hover: #dc2626; }
        
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        /* Dark mode styles */
        .dark body { background: #0f172a; color: #e2e8f0; }
        body:not(.dark) { background: #f1f5f9; color: #1e293b; }
        
        .khmer-title { font-family: "Moul", serif; }
        
        .main-content {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        body:not(.dark) .main-content {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .nav-link.active {
            background: var(--theme-color);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.39);
        }
        .nav-link:hover {
             background: #334155;
        }
        body:not(.dark) .nav-link:hover {
            background: #e2e8f0;
        }
        body:not(.dark) .nav-link.active:hover {
            background: var(--theme-color-hover);
        }
        .nav-link.active:hover {
            background: var(--theme-color-hover);
        }

        .filter-select {
            background-color: #E5E7EB; color: #111827;
            padding: 0.5rem 2rem 0.5rem 0.75rem; font-size: 0.875rem;
            border-radius: 0.5rem; border: 1px solid #9CA3AF;
            -webkit-appearance: none; appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em;
        }
        .filter-select option { background: #F3F4F6; color: #000000; }
        @media (min-width: 768px) {
            .filter-select { padding: 0.6rem 2.5rem 0.6rem 1rem; font-size: 1rem; }
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px;}
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        body:not(.dark) ::-webkit-scrollbar-track { background: #e2e8f0; }
        body:not(.dark) ::-webkit-scrollbar-thumb { background: #94a3b8; }
        
        .video-container {
            position: relative;
            border: 5px solid transparent;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            aspect-ratio: 1 / 1; 
        }
        .video-container video {
            position: absolute; top: 50%; left: 50%;
            width: 100%; height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%) scaleX(-1);
        }
        .video-container.ready {  border-color: #4ade80; box-shadow: 0 0 25px rgba(74, 222, 128, 0.6); }
        .video-container.verifying { border-color: #fbbf24; box-shadow: 0 0 25px rgba(251, 191, 36, 0.6); }
        .video-container.invalid { border-color: #f87171; box-shadow: 0 0 25px rgba(248, 113, 113, 0.6); }
        
        .scanner-line {
            position: absolute; left: 0; width: 100%; height: 3px;
            background: linear-gradient(to right, transparent, #4ade80, transparent);
            box-shadow: 0 0 10px #4ade80;
            animation: scan 3s linear infinite;
            opacity: 0; transition: opacity 0.3s;
        }
        .video-container.ready .scanner-line, .video-container.verifying .scanner-line { opacity: 1; }
        .video-container.verifying .scanner-line { background: linear-gradient(to right, transparent, #fbbf24, transparent); box-shadow: 0 0 10px #fbbf24; }
        @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }

        /* Theme-aware text and backgrounds */
        .text-main { color: #e2e8f0; }
        .text-muted { color: #94a3b8; }
        .bg-main { background-color: #0f172a; }
        .bg-content { background-color: #1e293b; }
        .bg-sidebar { background-color: #1e293b; }
        .border-main { border-color: #334155; }
        
        body:not(.dark) .text-main { color: #1e293b; }
        body:not(.dark) .text-muted { color: #475569; }
        body:not(.dark) .bg-main { background-color: #f1f5f9; }
        body:not(.dark) .bg-content { background-color: #ffffff; }
        body:not(.dark) .bg-sidebar { background-color: #ffffff; }
        body:not(.dark) .border-main { border-color: #e2e8f0; }

        /* Themed buttons */
        .btn-theme {
            background-color: var(--theme-color);
            color: white;
        }
        .btn-theme:hover {
            background-color: var(--theme-color-hover);
        }
        .text-theme { color: var(--theme-color); }
        .border-theme { border-color: var(--theme-color); }
        .ring-theme {
             --tw-ring-color: var(--theme-color);
        }
        
    </style>
</head>
<body class="dark"> <!-- Start in dark mode by default -->
    <!-- The React app will attach here -->
    <div id="root"></div>
    
    <!-- Load the React App -->
    <script type="text/babel" src="app.jsx"></script>
</body>
</html>
